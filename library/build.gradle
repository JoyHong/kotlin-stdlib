plugins {
    id 'com.android.library'
    id 'kotlin-android'
}

android {
    compileSdk 35

    defaultConfig {
        minSdkVersion 23
        targetSdkVersion 35
        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        viewBinding true
        dataBinding true
    }
    namespace 'org.justalk.kotlin.stdlib'

}

dependencies {

    api "androidx.lifecycle:lifecycle-common-java8:2.9.1"
    api "androidx.lifecycle:lifecycle-process:2.9.1"
    api "androidx.lifecycle:lifecycle-extensions:2.2.0"
    api "androidx.navigation:navigation-fragment-ktx:2.9.2"
    api "androidx.core:core-ktx:1.16.0"
    api "androidx.activity:activity-ktx:1.10.1"
    api "androidx.recyclerview:recyclerview:1.4.0"
    api "androidx.constraintlayout:constraintlayout:2.2.1"
    api 'androidx.appcompat:appcompat:1.7.1'
    api 'androidx.emoji:emoji-appcompat:1.1.0'
    api 'androidx.exifinterface:exifinterface:1.4.1'
    compileOnly 'com.google.android.gms:play-services-location:21.3.0'
    compileOnly 'org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.8.0'
    compileOnly 'com.google.android.gms:play-services-maps:19.2.0'
}