plugins {
    id 'com.android.library'
    id 'kotlin-android'
}

android {
    compileSdk 34

    defaultConfig {
        minSdkVersion 23
        targetSdkVersion 34
        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        viewBinding true
        dataBinding true
    }
    namespace 'org.justalk.kotlin.stdlib'

}

dependencies {

    implementation "androidx.lifecycle:lifecycle-common-java8:2.8.3"
    implementation "androidx.lifecycle:lifecycle-process:2.8.3"
    implementation "androidx.lifecycle:lifecycle-extensions:2.2.0"
    implementation "androidx.navigation:navigation-fragment-ktx:2.7.7"
    implementation "androidx.core:core-ktx:1.13.1"
    implementation "androidx.activity:activity:1.9.0"
    implementation "androidx.recyclerview:recyclerview:1.3.2"
    implementation "androidx.constraintlayout:constraintlayout:2.1.4"

    compileOnly 'com.google.android.gms:play-services-location:21.3.0'
    compileOnly 'org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.8.0'

    compileOnly 'com.google.android.gms:play-services-maps:19.0.0'
}